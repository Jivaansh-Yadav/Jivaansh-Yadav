<svg xmlns="http://www.w3.org/2000/svg" width="600" height="150" viewBox="0 0 600 150" role="img">
<style>
  .t{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;}
  .m{font-family:'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', monospace;}
  .fade{animation:fade .9s ease both}
  .run{stroke-dasharray:233.8 1227.3;animation:run 7s linear infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1461.1}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
  @media (prefers-reduced-motion: reduce){.fade,.run,.pulse{animation:none}}
</style>
<defs>
  <linearGradient id="bg51" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171c26"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="glow51" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#36BCF7" stop-opacity="0.22"/><stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="fade">
  <rect x="1" y="1" width="598" height="148" rx="18" fill="url(#bg51)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="598" height="148" rx="18" fill="url(#glow51)"/>
  <rect x="1" y="1" width="598" height="148" rx="18" fill="none" stroke="#36BCF7" stroke-width="2.2" stroke-linecap="round" class="run"/>
<text x="300" y="52" text-anchor="middle" font-size="26" font-weight="800" fill="#e6edf3" class="t">Let's build something weird.</text>
<text x="300" y="80" text-anchor="middle" font-size="13.5" fill="#9da7b3" class="t">Got a weird idea, a collab, or a project worth prototyping?</text>
<rect x="238" y="98" width="124" height="32" rx="16" fill="#36BCF7"/>
<text x="300" y="119" text-anchor="middle" font-size="13.5" font-weight="800" fill="#0d1117" class="t">Say hi.</text>
</g>
</svg>