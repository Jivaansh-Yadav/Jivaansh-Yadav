<svg xmlns="http://www.w3.org/2000/svg" width="265" height="58" viewBox="0 0 265 58" role="img">
<style>
  .t{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;}
  .m{font-family:'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', monospace;}
  .fade{animation:fade .9s ease both}
  .run{stroke-dasharray:94.1 494.1;animation:run 7s linear infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-588.2}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
  @media (prefers-reduced-motion: reduce){.fade,.run,.pulse{animation:none}}
</style>
<defs>
  <linearGradient id="bg43" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171c26"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="glow43" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#bb9af7" stop-opacity="0.22"/><stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="fade">
  <rect x="1" y="1" width="263" height="56" rx="29" fill="url(#bg43)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="263" height="56" rx="29" fill="url(#glow43)"/>
  <rect x="1" y="1" width="263" height="56" rx="29" fill="none" stroke="#bb9af7" stroke-width="2.2" stroke-linecap="round" class="run"/>
<path d="M30 29 l7 -7 l7 7 l-7 7 z" fill="#bb9af7"/>
<text x="132" y="37" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="0.5" fill="#e6edf3" class="t">Tech Stack</text>
<path d="M221 29 l7 -7 l7 7 l-7 7 z" fill="#bb9af7"/>
</g>
</svg>