<svg xmlns="http://www.w3.org/2000/svg" width="236" height="58" viewBox="0 0 236 58" role="img">
<style>
  .t{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;}
  .m{font-family:'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', monospace;}
  .fade{animation:fade .9s ease both}
  .run{stroke-dasharray:84.8 445.4;animation:run 7s linear infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-530.2}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
  @media (prefers-reduced-motion: reduce){.fade,.run,.pulse{animation:none}}
</style>
<defs>
  <linearGradient id="bg42" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171c26"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="glow42" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#9ece6a" stop-opacity="0.22"/><stop offset="1" stop-color="#9ece6a" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="fade">
  <rect x="1" y="1" width="234" height="56" rx="29" fill="url(#bg42)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="234" height="56" rx="29" fill="url(#glow42)"/>
  <rect x="1" y="1" width="234" height="56" rx="29" fill="none" stroke="#9ece6a" stroke-width="2.2" stroke-linecap="round" class="run"/>
<path d="M30 29 l7 -7 l7 7 l-7 7 z" fill="#9ece6a"/>
<text x="118" y="37" text-anchor="middle" font-size="23" font-weight="800" letter-spacing="0.5" fill="#e6edf3" class="t">Projects</text>
<path d="M192 29 l7 -7 l7 7 l-7 7 z" fill="#9ece6a"/>
</g>
</svg>