<svg xmlns="http://www.w3.org/2000/svg" width="400" height="206" viewBox="0 0 400 206" role="img">
<style>
  .t{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;}
  .m{font-family:'Fira Code', 'SF Mono', Consolas, 'Liberation Mono', monospace;}
  .fade{animation:fade .9s ease both}
  .run{stroke-dasharray:187.7 985.4;animation:run 7s linear infinite}
  .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes run{from{stroke-dashoffset:0}to{stroke-dashoffset:-1173.1}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
  @media (prefers-reduced-motion: reduce){.fade,.run,.pulse{animation:none}}
</style>
<defs>
  <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171c26"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="glow1" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#36BCF7" stop-opacity="0.22"/><stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="fade">
  <rect x="1" y="1" width="398" height="204" rx="18" fill="url(#bg1)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="1" y="1" width="398" height="204" rx="18" fill="url(#glow1)"/>
  <rect x="1" y="1" width="398" height="204" rx="18" fill="none" stroke="#36BCF7" stroke-width="2.2" stroke-linecap="round" class="run"/>
<text x="28" y="50" font-size="22" font-weight="700" fill="#e6edf3" class="t">Lambda Prep</text>
<text x="28" y="82" font-size="13.5" fill="#9da7b3" class="t">Resource Hub for CISCE students.</text>
<rect x="28" y="130" width="123" height="24" rx="12" fill="#e0af68" fill-opacity="0.14" stroke="#e0af68" stroke-opacity="0.55"/><circle cx="42" cy="142" r="3.5" fill="#e0af68" class="pulse"/><text x="56" y="146" font-size="11.5" font-weight="600" fill="#e0af68" class="t">In Progress</text>
<rect x="159.4" y="130" width="95" height="24" rx="12" fill="#36BCF7" fill-opacity="0.14" stroke="#36BCF7" stroke-opacity="0.55"/><text x="173.4" y="146" font-size="11.5" font-weight="600" fill="#36BCF7" class="t">Education</text>
<text x="28" y="186" font-size="13" font-weight="700" fill="#36BCF7" class="t">View repository →</text>

</g>
</svg>