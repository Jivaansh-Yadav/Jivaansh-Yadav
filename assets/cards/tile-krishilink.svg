<svg xmlns="http://www.w3.org/2000/svg" width="152" height="110" viewBox="0 0 152 110" role="img">
<style>
  .t{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;}
  .fade{animation:fade .9s ease both}
  .pulse{animation:pulse 1.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(1.6)}}
  @media (prefers-reduced-motion: reduce){.fade,.pulse{animation:none}}
</style>
<defs>
  <linearGradient id="tg-krishilink" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171c26"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="gl-krishilink" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#9ece6a" stop-opacity="0.26"/><stop offset="1" stop-color="#9ece6a" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="fade">
  <rect x="0.75" y="0.75" width="150.5" height="108.5" rx="12" fill="url(#tg-krishilink)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="150.5" height="108.5" rx="12" fill="url(#gl-krishilink)"/>
  <rect x="0.75" y="0.75" width="163.5" height="2" rx="1" fill="#9ece6a" opacity="0.55"/>
  <text x="12" y="30" font-size="12.5" font-weight="700" fill="#e6edf3" class="t">KrishiLink</text>
  <text x="12" y="48" font-size="8.6" fill="#9da7b3" class="t">Farmer-to-buyer market</text>
  <rect x="12" y="62" width="52" height="16" rx="8" fill="#9ece6a" fill-opacity="0.14" stroke="#9ece6a" stroke-opacity="0.5"/>
  <circle cx="21.5" cy="70" r="2.6" fill="#9ece6a" class="pulse"/>
  <text x="28" y="73.4" font-size="7.6" font-weight="600" fill="#9ece6a" class="t">Shipped</text>
  <text x="12" y="101" font-size="8" font-weight="600" fill="#9ece6a" class="t">Repo →</text>
</g>
</svg>
