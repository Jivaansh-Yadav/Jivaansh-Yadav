<svg xmlns="http://www.w3.org/2000/svg" width="152" height="110" viewBox="0 0 152 110" role="img">
<style>
  .t{font-family:'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif;}
  .fade{animation:fade .9s ease both}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @media (prefers-reduced-motion: reduce){.fade{animation:none}}
</style>
<defs>
  <linearGradient id="tg-more" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#171c26"/><stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <radialGradient id="gl-more" cx="1" cy="0" r="0.9">
    <stop offset="0" stop-color="#36BCF7" stop-opacity="0.26"/><stop offset="1" stop-color="#36BCF7" stop-opacity="0"/>
  </radialGradient>
</defs>
<g class="fade">
  <rect x="0.75" y="0.75" width="150.5" height="108.5" rx="12" fill="url(#tg-more)" stroke="#30363d" stroke-width="1.5"/>
  <rect x="0.75" y="0.75" width="150.5" height="108.5" rx="12" fill="url(#gl-more)"/>
  <rect x="0.75" y="0.75" width="150.5" height="2" rx="1" fill="#36BCF7" opacity="0.55"/>
  <text x="12" y="30" font-size="12.5" font-weight="700" fill="#e6edf3" class="t">...and much more</text>
  <text x="12" y="48" font-size="8.6" fill="#9da7b3" class="t">Next weird side-quest</text>
  <text x="12" y="76" font-size="8" font-weight="600" fill="#36BCF7" class="t">All repos →</text>
</g>
</svg>
